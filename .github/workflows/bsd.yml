name: BSD binaries

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      source_ref:
        description: Source commit or release tag to build
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: bsd-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build ${{ matrix.os }} amd64
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        os: [freebsd, openbsd, netbsd]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_ref || github.sha }}
          persist-credentials: false

      - name: Build and test on FreeBSD 15.1
        if: matrix.os == 'freebsd'
        uses: vmactions/freebsd-vm@c46abacb49f09938ca4e1702d15d836285d694cc # v1
        with:
          release: '15.1'
          arch: x86_64
          mem: 4096
          cpu: 2
          prepare: sh .github/scripts/bsd-deps.sh freebsd
          run: sh .github/scripts/build-bsd.sh freebsd

      - name: Build and test on OpenBSD 8.0
        if: matrix.os == 'openbsd'
        uses: vmactions/openbsd-vm@f1ca8bc8ecc5b6ef7218e5b914836e067e1546d3 # v1
        with:
          release: '8.0'
          arch: x86_64
          mem: 4096
          cpu: 2
          prepare: sh .github/scripts/bsd-deps.sh openbsd
          run: sh .github/scripts/build-bsd.sh openbsd

      - name: Build and test on NetBSD 11.0
        if: matrix.os == 'netbsd'
        uses: vmactions/netbsd-vm@c8a0d7ddb84619a7a8cc4e652efa7950b3fd9f92 # v1
        with:
          release: '11.0'
          arch: x86_64
          mem: 4096
          cpu: 2
          prepare: sh .github/scripts/bsd-deps.sh netbsd
          run: sh .github/scripts/build-bsd.sh netbsd

      - name: Upload the packaged BSD target
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ matrix.os }}-amd64
          path: |
            dist/ff-${{ matrix.os }}-amd64
            dist/fastfind-${{ matrix.os }}-amd64.tar.gz
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
