name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, macos-15]
        threads: ["on", "off"]
    steps:
      - name: Check out source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Install PCRE runtime (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends libpcre3

      - name: Install PCRE runtime (macOS)
        if: runner.os == 'macOS'
        run: brew install pcre

      - name: Set up Nim
        uses: jiro4989/setup-nim-action@cb1fc1270b117457dd0d9f610ec981fad3369cec # v2
        with:
          nim-version: 2.2.10
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build optimized threaded binary
        run: nim c --mm:orc --threads:${{ matrix.threads }} -d:release --opt:speed -o:/tmp/fastfind-under-test src/ff.nim

      - name: Run parser and matcher tests
        run: |
          if [ "$RUNNER_OS" = macOS ]; then
            export DYLD_FALLBACK_LIBRARY_PATH="$(brew --prefix pcre)/lib"
          fi
          nim c -r --mm:orc --threads:${{ matrix.threads }} --outdir:/tmp tests/test_nlp.nim
          nim c -r --mm:orc --threads:${{ matrix.threads }} --outdir:/tmp tests/test_engine.nim
          nim c -r --mm:orc --threads:${{ matrix.threads }} --outdir:/tmp tests/test_tui_input.nim

      - name: Run CLI regression tests
        run: |
          if [ "$RUNNER_OS" = macOS ]; then
            export DYLD_FALLBACK_LIBRARY_PATH="$(brew --prefix pcre)/lib"
          fi
          bash tests/cli_regression.sh /tmp/fastfind-under-test
          python3 tests/search_regression.py /tmp/fastfind-under-test
          python3 tests/interactive_regression.py /tmp/fastfind-under-test

      - name: Exercise traversal without dirent.d_type
        if: matrix.threads == 'on'
        run: |
          if [ "$RUNNER_OS" = macOS ]; then
            export DYLD_FALLBACK_LIBRARY_PATH="$(brew --prefix pcre)/lib"
          fi
          nim c --mm:orc --threads:on -d:release -d:fastfindNoDType --opt:speed -o:/tmp/fastfind-portable-under-test src/ff.nim
          bash tests/cli_regression.sh /tmp/fastfind-portable-under-test
          python3 tests/search_regression.py /tmp/fastfind-portable-under-test

      - name: Validate shell scripts and patch hygiene
        run: |
          bash -n install.sh
          bash -n update.sh
          bash tests/installer_regression.sh
          git diff --check

  manpages:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    strategy:
      matrix:
        runner: [ubuntu-24.04, macos-15]
    steps:
      - name: Check out source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Install formatters (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends mandoc groff man-db bsdextrautils

      - name: Install groff (macOS)
        if: runner.os == 'macOS'
        run: brew install groff

      - name: Check portable roff and both installed man aliases
        run: |
          python3 tests/manpage_regression.py --require mandoc --require groff --require nroff --require man
          sh tests/manpage_portability.sh

  posix-compile:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Nim
        uses: jiro4989/setup-nim-action@cb1fc1270b117457dd0d9f610ec981fad3369cec # v2
        with:
          nim-version: 2.2.10
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate C for POSIX targets (Solaris also covers illumos)
        run: |
          for target in linux macosx freebsd openbsd netbsd solaris; do
            for threads in on off; do
              nim c --compileOnly --os:$target --cpu:amd64 --mm:orc --threads:$threads --nimcache:/tmp/fastfind-$target-$threads src/ff.nim
            done
          done

  windows-build:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Nim
        uses: jiro4989/setup-nim-action@cb1fc1270b117457dd0d9f610ec981fad3369cec # v2
        with:
          nim-version: 2.2.10
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install PCRE development files
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & 'C:\msys64\usr\bin\bash.exe' -lc 'pacman -Sy --noconfirm --needed mingw-w64-x86_64-pcre'
          if ($LASTEXITCODE -ne 0) {
            throw "MSYS2 failed to install PCRE"
          }

      - name: Build and test the Windows binary
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $pcreRoot = 'C:\msys64\mingw64'
          $pcreArchive = Join-Path $pcreRoot 'lib\libpcre.a'
          if (-not (Test-Path $pcreArchive -PathType Leaf)) {
            throw "PCRE static library was not found at $pcreArchive"
          }

          & nim c `
            --mm:orc `
            --threads:on `
            -d:release `
            -d:usePcreHeader `
            --opt:speed `
            '--passC:-DPCRE_STATIC' `
            '--passC:-Wno-error=incompatible-pointer-types' `
            "--passC:-I$($pcreRoot.Replace('\', '/'))/include" `
            "--passL:$($pcreArchive.Replace('\', '/'))" `
            '-o:fastfind-under-test.exe' `
            src/ff.nim
          if ($LASTEXITCODE -ne 0) {
            throw "Nim compilation failed"
          }

          & .\fastfind-under-test.exe --version
          if ($LASTEXITCODE -ne 0) {
            throw "the Windows binary did not start"
          }

          $result = & .\fastfind-under-test.exe --contains-re 'import std' --fixed ff.nim src
          if ($LASTEXITCODE -ne 0 -or $result -notmatch 'ff\.nim') {
            throw "the Windows binary failed its regex smoke test"
          }

          $fixture = Join-Path $env:RUNNER_TEMP 'fastfind-shell-test'
          New-Item -ItemType Directory -Force $fixture | Out-Null
          New-Item -ItemType File -Path (Join-Path $fixture 'bad&name.txt') | Out-Null
          & .\fastfind-under-test.exe --fixed 'bad&name.txt' $fixture --exec-cmd 'echo {}' --shell
          if ($LASTEXITCODE -ne 2) {
            throw "unsafe Windows shell path was not rejected"
          }
          $global:LASTEXITCODE = 0
